<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueueForge — distributed job queue and scheduler dashboard" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D2430'/%3E%3Cpath d='M8 21h16M10 16h12M12 11h8' stroke='%23E8590C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>QueueForge</title>
    <script>
      // Theme: an explicit data-theme on <html> (set by an embedding host) wins,
      // then the user's saved choice, then the OS preference.
      ;(function () {
        const root = document.documentElement
        function apply() {
          let saved = null
          try { saved = localStorage.getItem('qf-theme') } catch (e) {}
          const host = root.getAttribute('data-theme')
          const dark = host ? host === 'dark' : saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          root.classList.toggle('dark', dark)
        }
        apply()
        new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
